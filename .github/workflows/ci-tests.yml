name: CI Tests

on: [push, pull_request]

jobs:

  test:

    name: "Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]


    steps:
      - uses: actions/checkout@v2
      
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
          
      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "24.10.2"

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | NF_TEST_VERSION=0.9.1 bash
          sudo mv nf-test /usr/local/bin/
          
      - name: Build Docker 
        run:  docker build -t genepi/imputationserver2 .
        
      - name: Run Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: nf-test test --ci --shard ${{ matrix.shard }}/${{ strategy.job-total }}
